name: PR 1160 Windows preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: openless-all/app
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_INCREMENTAL: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 10
      - name: Verify source revision
        working-directory: .
        run: |
          $expected = 'a47b5d7fbfd53e7f53b0298290e143ff51cb7bc5'
          git merge-base --is-ancestor $expected HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected source revision' }
          $changed = @(git diff --name-only $expected HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/ci.yml') {
            throw 'Preview branch must only change its build workflow'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: openless-all/app/src-tauri -> target
          shared-key: pr-1160-windows-preview
      - name: Prepare Windows manifests
        timeout-minutes: 5
        run: |
          Write-Host '[prepare] Removing the macOS-only dependency from the Windows build graph'
          node scripts/ci-disable-macos-qwen3.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare Windows manifests' }
      - name: Download Sherpa Windows libraries
        timeout-minutes: 8
        run: |
          $lock = Get-Content -LiteralPath src-tauri/Cargo.lock -Raw
          $version = [regex]::Match($lock, '(?ms)\[\[package\]\]\r?\nname = "sherpa-onnx-sys"\r?\nversion = "([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Missing Sherpa version' }
          $name = "sherpa-onnx-v$version-win-x64-static-MT-Release-lib.tar.bz2"
          $root = Join-Path $PWD 'src-tauri/target/sherpa-onnx-prebuilt'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $archive = Join-Path $root $name
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$version/$name"
          Write-Host "[download] $url"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          curl.exe --fail --location --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 --retry-max-time 360 --progress-bar --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "Sherpa download failed: curl exit $LASTEXITCODE" }
          $bytes = (Get-Item -LiteralPath $archive).Length
          Write-Host "[download] Finished: $bytes bytes in $($watch.Elapsed.TotalSeconds.ToString('F1')) seconds"
          if ($bytes -lt 1MB) { throw 'Sherpa archive is unexpectedly small' }
          if ($version -eq '1.13.2') {
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne '847a5176904d6ad1e4825b7d20ebb11bd7e9898a7596d3d4ff059f43674db031') {
              throw 'Sherpa archive does not match the published release checksum'
            }
          }
      - name: Extract Sherpa Windows libraries
        timeout-minutes: 10
        run: |
          $script = (Resolve-Path ./scripts/prepare-windows-sherpa.ps1).Path
          $root = Join-Path $PWD 'src-tauri/target/sherpa-onnx-prebuilt'
          $archive = Get-ChildItem -LiteralPath $root -Filter '*.tar.bz2' -File | Select-Object -First 1
          if (-not $archive) { throw 'Downloaded archive is missing' }
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          Write-Host "[extract] Archive: $($archive.FullName); tool: $sevenZip"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & $sevenZip x $archive.FullName "-o$root" -y -bsp1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to decompress the bzip2 layer' }
          $tarArchive = Get-ChildItem -LiteralPath $root -Filter '*.tar' -File | Select-Object -First 1
          if (-not $tarArchive) { throw 'The decompressed tar archive is missing' }
          Write-Host "[extract] Unpacking tar contents after $($watch.Elapsed.TotalSeconds.ToString('F1')) seconds"
          & $sevenZip x $tarArchive.FullName "-o$root" -y -bsp1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract the tar contents' }
          Write-Host '[extract] Checking the extracted libraries with the upstream preparation script'
          & $script
          if (-not (Select-String -LiteralPath $env:GITHUB_ENV -Pattern '^SHERPA_ONNX_LIB_DIR=' -Quiet)) {
            throw 'Sherpa library directory was not exported'
          }
          Write-Host "[extract] Finished in $($watch.Elapsed.TotalSeconds.ToString('F1')) seconds"
      - name: Install frontend dependencies
        run: |
          pnpm import
          if ($LASTEXITCODE -ne 0) { throw 'Failed to import the upstream lockfile' }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install dependencies' }
          pnpm exec esbuild --version
          if ($LASTEXITCODE -ne 0) { throw 'esbuild executable is unavailable' }
      - name: Build standalone Windows preview
        run: |
          @{ build = @{ beforeBuildCommand = 'pnpm run build' } } |
            ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8 .windows-preview-tauri.json
          pnpm exec tauri build --debug --no-bundle --config .windows-preview-tauri.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows preview build failed' }
      - name: Collect executable and runtime files
        run: |
          $targetDir = Join-Path $PWD 'src-tauri/target/debug'
          $output = Join-Path $env:GITHUB_WORKSPACE 'windows-preview'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $exe = Join-Path $targetDir 'openless.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'openless.exe was not produced' }
          Copy-Item -LiteralPath $exe -Destination $output
          Get-ChildItem -LiteralPath $targetDir -Filter '*.dll' -File |
            Copy-Item -Destination $output
          $loader = Get-ChildItem -LiteralPath (Join-Path $targetDir 'build') -Filter 'WebView2Loader.dll' -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if ($loader) { Copy-Item -LiteralPath $loader.FullName -Destination $output }
          $dependencyReport = Join-Path $output 'native-dependencies.txt'
          dumpbin /DEPENDENTS $exe | Out-File -Encoding utf8 $dependencyReport
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect native dependencies' }
          $info = [ordered]@{
            repository = 'leolulu/openless'
            pr = 'https://github.com/Open-Less/openless/pull/1160'
            sourceCommit = 'a47b5d7fbfd53e7f53b0298290e143ff51cb7bc5'
            workflowCommit = $env:GITHUB_SHA
            runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            build = 'Windows x64 native Tauri debug build with embedded frontend; no installer'
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $info | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'build-info.json')
          @'
          PR #1160 Windows preview

          This is a native Windows application with the PR frontend embedded.
          Close the installed OpenLess completely before launching openless.exe.
          Keep all files in this directory together. WebView2 Runtime is required.
          This preview uses the standard OpenLess user-data and credential locations.
          It is for a short manual UI check; it is not an installer or a new release.
          '@ | Set-Content -Encoding utf8 (Join-Path $output 'README.txt')
          Get-ChildItem -LiteralPath $output -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $output 'SHA256SUMS.txt')
          Get-ChildItem -LiteralPath $output -File | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: openless-pr-1160-windows-x64-preview
          path: windows-preview/
          if-no-files-found: error
          retention-days: 14
